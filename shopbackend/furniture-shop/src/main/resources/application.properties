spring.application.name=furniture-shop

# ==========================
# Database Configuration
# ==========================

spring.datasource.url=jdbc:mysql://localhost:3306/furniture_shop
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / Hibernate
# ==========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================
# File Upload Configuration
# ==========================

spring.servlet.multipart.enabled=true

# Maximum size of a single uploaded image
spring.servlet.multipart.max-file-size=5MB

# Maximum size of the complete multipart request
spring.servlet.multipart.max-request-size=5MB

# ==========================
# JWT Configuration
# ==========================

jwt.secret=VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9yRnVybml0dXJlU2hvcEFwcDEyMzQ1Njc4OTA=
jwt.expiration=86400000

# ==========================
# Server
# ==========================

server.port=8081

# Razorpay test/live credentials must be supplied as environment variables.
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}